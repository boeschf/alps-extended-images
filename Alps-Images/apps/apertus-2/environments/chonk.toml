image = "jfrog.svc.cscs.ch#docker-group-csstaff/alps-images/apertus-2-megatron-base-cuda:alps7-dev-8abe4a7cfe5af037f8e08b18656414af"

mounts = [
    "/capstor/",
    "/iopsstor/",
    "/ritom/",
    "${HOME}:${HOME}",
]

workdir = "${PWD}"
writable = true

[env]
UCCL_EP_TRANSPORT = "cxi"
PMIX_MCA_psec = "native"
NCCL_PXN_DISABLE = "1"
NCCL_CROSS_NIC = "0"

[annotations]
com.hooks.cxi.enabled = "false"
com.hooks.netstack.source = "artifact"
